<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch Lab</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>Fetch Lab</h1>
      <p class="sub">Lesson 5: the same request, written with fetch and with axios.</p>

      <div class="controls">
        <label><input type="radio" name="url" value="good" checked /> Good URL</label>
        <label><input type="radio" name="url" value="bad" /> Broken URL (404)</label>
      </div>

      <div class="grid">
        <section>
          <h2>fetch</h2>
          <button id="run-fetch" type="button">Run</button>
          <pre id="out-fetch">Not run yet.</pre>
        </section>
        <section>
          <h2>axios</h2>
          <button id="run-axios" type="button">Run</button>
          <pre id="out-axios">Not run yet.</pre>
        </section>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
